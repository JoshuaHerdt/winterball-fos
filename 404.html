<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden · Events FOS Holzkirchen</title>
<link rel="stylesheet" href="/winterball-fos/fonts/f-c9660de5.css">
<style>
  :root { --paper: #fbfcfd; --tint: #eef3f9; --ink: #15202d; --ink-2: #4c5869; --line: #e1e6ed; --blue: #1c4587; --orange: #ef9216; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 400 16px/1.6 "Hanken Grotesk", system-ui, sans-serif; display: grid; place-items: center; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); }
  main { max-width: 520px; text-align: center; }
  .mark { width: 48px; height: 48px; margin: 0 auto 28px; border-radius: 12px; background: var(--blue); color: #fff; display: grid; place-items: center; font: 600 13px/1 system-ui, sans-serif; position: relative; overflow: hidden; }
  .mark::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--orange); }
  p.code { margin: 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  h1 { margin: 10px 0 12px; font: 300 clamp(40px, 8vw, 60px)/1.05 "Newsreader", Georgia, serif; letter-spacing: -.02em; }
  p { color: var(--ink-2); margin: 0 0 28px; }
  nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a { display: inline-flex; align-items: center; padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; background: var(--tint); color: var(--blue); }
  a.primary { background: var(--blue); color: #fff; }
  a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">FOS</div>
  <p class="code">Fehler 404</p>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Vielleicht hat sich die Adresse geändert. Von der Startseite aus findest du alle Events der FOS Holzkirchen.</p>
  <nav aria-label="Weiter">
    <a class="primary" href="/winterball-fos/">Zur Startseite</a>
    <a href="/winterball-fos/winterball/">Winterball</a>
    <a href="/winterball-fos/abiball/">Abiball</a>
  </nav>
</main>
</body>
</html>
